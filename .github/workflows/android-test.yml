name: Android test run

# Installs the app on a virtual Android phone, opens it, and saves the system
# log, so crashes can be read without a real phone. The log is published to the
# release called "android-test-log".

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS: "34.0.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android NDK and build tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-34"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: emulator

      - run: npm install

      - name: Set up the Android project
        run: .github/scripts/android-prepare.sh

      # Same release build as the real one, but for the emulator's processor.
      - name: Build
        run: npx tauri android build --apk --target x86_64

      - name: Sign
        run: |
          UNSIGNED=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -n 1)
          TOOLS="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"
          "$TOOLS/zipalign" -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks android-signing/straycat-rss.keystore --ks-key-alias straycat \
            --ks-pass pass:straycatrss --key-pass pass:straycatrss --out test.apk aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: .github/scripts/android-smoke.sh

      - name: Publish the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la logcat-*.txt || exit 0
          gh release delete android-test-log --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-test-log logcat-*.txt --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Android test log" --notes "System log from an emulator run of commit ${GITHUB_SHA::7}."
